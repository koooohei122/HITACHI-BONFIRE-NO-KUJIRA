<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>デモ — 日立かがりびの鯨</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a1628;
        font-family: sans-serif;
        color: #fff;
      }

      .card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 40px 36px;
        width: min(340px, 90vw);
        text-align: center;
      }

      .card h1 {
        margin: 0 0 4px;
        font-size: 1.3rem;
        letter-spacing: 0.03em;
      }

      .card p {
        margin: 0 0 28px;
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.5);
      }

      input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 1rem;
        outline: none;
        margin-bottom: 12px;
        transition: border-color 0.2s;
      }

      input[type="password"]:focus {
        border-color: #4a9eff;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #2a5caa;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover { background: #3a72cc; }

      #error {
        margin-top: 14px;
        font-size: 0.82rem;
        color: #ff6b6b;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🐋 デモモード</h1>
      <p>日立かがりびの鯨 — 自宅テスト用</p>

      <form id="form">
        <input
          id="pw"
          type="password"
          placeholder="パスワード"
          autocomplete="current-password"
          autofocus
        />
        <button type="submit">入る</button>
      </form>
      <div id="error"></div>
    </div>

    <script type="module">
      const HASH = "ae7a5e09ffe0015becce6b38f3581af71753a41aaf71f9669416faab8bf55e05";

      async function sha256(text) {
        const buf = await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(text)
        );
        return Array.from(new Uint8Array(buf))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const pw = document.getElementById("pw").value;
        const hash = await sha256(pw);
        if (hash === HASH) {
          location.href = "./index.html?demo=1";
        } else {
          document.getElementById("error").textContent = "パスワードが違います";
          document.getElementById("pw").value = "";
          document.getElementById("pw").focus();
        }
      });
    </script>
  </body>
</html>
